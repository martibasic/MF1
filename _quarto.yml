        <script src="assets/mf1-science.js"></script>
        <script src="assets/mf1-field-models.js"></script>
    include-after-body:
      text: |
        <script src="assets/mf1-extra-labs.js"></script>
        <script src="assets/mf1-field-lab.js"></script>
        <script src="assets/mf1-layout.js"></script>
        <script src="assets/mf1-instruments.js"></script>
    toc: false
    number-sections: false
    code-fold: false

editor: visual
